<!-- THIS IS THE SOURCE OF assets/og.png. It started as one of five design-shotgun variants
     and won; the shipped card is this file rendered at 1200x630, nothing else. Two other
     files in this repo look like they are the OG source and are NOT — tools/og-card.html
     (the pre-shotgun oats-paper card, its own header comment now stale) and the root
     og-card.html (older still, headline "A club for whatever you make."). Edit THIS one.
     Re-render:
       browse viewport 1200x630
       browse goto file://$PWD/_shotgun-og/r6-A.html
       browse wait --networkidle
       browse screenshot --selector ".card" assets/og.png

     RE-CUT 2026-08-08, tracking the fold. The page's H1 became "Show-and-tell with
     deadlines." and the blank moved down to the sub, so the card follows it line for line:
     the headline is the H1, and the kicker is the sub WITH ITS BLANK still drawn as a rule
     and a full stop. The card's whole device has always been that blank; demoting it with
     the sentence it ends is cheaper than inventing a second one.
     THE KICKER IS NO LONGER THE TAGLINE, and that is the one rule this file used to state
     in its own header. It could not survive the rewrite: the tagline is "Clubs for regular
     show-and-tells." and the headline above it now says "Show-and-tell with deadlines.",
     so keeping both put the same noun on the card twice in eleven words. The tagline is
     still in four slots (title, og:title, twitter:title, the footer signature) and og:title
     renders directly beside this image in every preview that shows one, so the card does
     not have to say it a fifth time. What the kicker has to match now is index.html's SUB.
     If either moves, move the other. -->

<style>

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px}
.card{position:relative;width:1200px;height:630px;overflow:hidden}
.lg,.dd{position:absolute}
.dd{pointer-events:none}
.pitch{font-family:"Courier Prime",monospace;font-style:italic;font-weight:700;
letter-spacing:-.02em}
.birdie{font-family:"Patrick Hand",cursive}
.sans{font-family:"Courier Prime",monospace;font-weight:700;letter-spacing:.14em;
text-transform:uppercase}

.card{background:var(--grass)}
/* 104px, not the 116px the old two-word headline was set at: this sentence's longer line
   ("with deadlines.", 15 characters) is 15 x .6em of Courier Prime = 9em, which is 1044px at
   116 and would leave 64px of card to the right of it. At 104 it is 936px and the right
   margin is a proper 172. Monospace, so this is exact and re-derivable: the ceiling is
   (1200 - left - margin) / 9. */
.h{position:absolute;left:92px;top:78px;color:var(--oats);font-size:104px;line-height:1.04}
/* the sub, carrying the blank. Flex on the baseline row so the rule and the stop stay welded
   to the end of "doing" no matter what the hand face measures — nothing here is hard-placed
   by eye except the row's own top. */
.kick{position:absolute;left:96px;color:var(--oats);font-size:50px;line-height:1.16}
.kick.k1{top:366px}
.kick.k2{top:424px;display:flex;align-items:flex-end;gap:18px}
.kick .blank{display:block;width:250px;height:26px;margin-bottom:14px}
