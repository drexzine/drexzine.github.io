<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>drex — og card 1200x630</title>
<!-- ============================================================================
     THE SHARE CARD. Rendered to assets/og.png at exactly 1200x630.

     HOW TO RE-RENDER (there is no build step in this repo):
       cd drex-landing && python3 -m http.server 8931 --bind 127.0.0.1 &
       B=~/.claude/skills/gstack/browse/dist/browse
       $B viewport 1200x630 ; $B goto "http://127.0.0.1:8931/og-card.html" ; sleep 4
       $B screenshot --viewport assets/og.png

     WHY IT SAYS WHAT IT SAYS. This is the hero most people meet first — a link in
     a DM, a bio tap, a preview card — so it carries the FOLD, verbatim, and not a
     separate line written for it. The previous card was two generations stale: it
     still read "A club for whatever you make", which ~15 cold testers at Manny's
     named as too vague to translate into anything, and it sold "a magazine" as the
     object when the page now says "issue".

     THE FACE is Sometype Mono, which is what --f-slab resolves to on the page
     (Pitch is listed first and is not licensed, so it falls through). Do not set
     this card in Courier Prime — the page stopped using it.

     GREEN GROUND, KNOWINGLY. The brand book's seven sanctioned combinations never
     ground anything in Grass; it appears as a bar in all of them. This card breaks
     that on purpose: it is the one surface with no context around it, and the green
     IS the recognition. Logged rather than fixed.
     ============================================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sometype+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Patrick+Hand&display=swap">
<style>
:root{--oats:#FEF6E4;--grass:#1CAB5B;--sambas:#414D57;--colorado:#F75458;--happy:#F1DD01;--ink:#2f2110}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
.card{position:relative;width:1200px;height:630px;background:var(--grass);overflow:hidden}

/* the ruled pad, faint, so the ground reads as paper and not as a colour field */
.card::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(180deg,transparent 0 33px,rgba(255,255,255,.07) 33px 34px)}

.msg{position:absolute;left:88px;top:0;height:630px;width:660px;
  display:flex;flex-direction:column;justify-content:center;z-index:2}

.head{font-family:"Sometype Mono",monospace;font-style:italic;font-weight:700;
  color:var(--oats);font-size:62px;line-height:1.03;letter-spacing:-.02em}

.sub{margin-top:34px;font-family:"Sometype Mono",monospace;font-weight:400;
  color:var(--oats);font-size:27px;line-height:1.32;max-width:20ch}

/* the deadline is the one element cold testers consistently understood, so it gets
   the page's own red tape rather than another weight of type */
.tape{position:relative;display:inline-block;color:var(--oats);padding:.06em .34em;
  font-weight:700}
.tape::before{content:"";position:absolute;left:-.08em;right:-.1em;top:.02em;bottom:.04em;
  background:var(--colorado);border:2.5px solid var(--ink);border-radius:3px;
  transform:rotate(-1.6deg);z-index:-1;box-shadow:4px 4px 0 0 var(--ink)}

/* the mark sits on its own taped card — the logo law forbids tilting or shadowing
   the wordmark itself, so the PAPER carries both and the mark stays upright */
.plate{position:absolute;right:74px;top:190px;width:330px;height:250px;
  background:var(--oats);border:3px solid var(--ink);border-radius:6px;
  box-shadow:10px 12px 0 0 rgba(0,0,0,.22);transform:rotate(2.4deg);
  display:flex;align-items:center;justify-content:center;z-index:2}
/* THE REAL MARK, not type. Setting the wordmark in a typeface is a worse logo
   violation than tilting it. It is unmodified here - no rotation, no shadow, no
   recolour, no filter. The PAPER under it carries the tilt and the offset shadow,
   which is exactly what the logo law allows and the masthead already does.
   THE WORDMARK, not the butterflies: a share card has to carry the NAME. It is the
   same SVG the masthead uses, recoloured to Grass, which is the book's instruction
   for a logo over a ground - pick the palette colour with the highest contrast. */
.plate .mark{display:block;width:214px}
.plate .mark svg{display:block;width:100%;height:auto}
.wash{position:absolute;left:-26px;top:-16px;width:120px;height:34px;
  background:rgba(241,221,1,.72);border-left:1px solid rgba(65,77,87,.2);
  border-right:1px solid rgba(65,77,87,.2);transform:rotate(-9deg)}
.proof{position:absolute;right:96px;bottom:112px;z-index:3;
  font-family:"Patrick Hand",cursive;font-size:34px;color:var(--oats);transform:rotate(-3deg)}
</style></head><body><div class="card">
