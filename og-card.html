<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>drex — og card 1200x630</title>
<!-- ============================================================================
     THE SHARE CARD → assets/og-v4.png, exactly 1200x630.

     RE-RENDER (no build step in this repo):
       python3 -m http.server 8931 --bind 127.0.0.1 &
       chromium --headless=new --screenshot=assets/og-v4.png --window-size=1200,630 \
         --hide-scrollbars --no-sandbox "http://127.0.0.1:8931/og-card.html"

     THE BRIEF (2026-09-03): "a beautiful perfect OG card which reflects our brand,
     the new fonts, and will grab attention and instantly communicate the product
     and be legible at tons of sizes and have very limited text (one sentence max)."

     WHAT CHANGED FROM v3. Three things had gone stale and one was always wrong:
       · it led with "Accountability buddies running their own magazine.", which has
         not been the page's fold since 2026-09-02;
       · it was set in Sometype Mono, the STAND-IN. Pitch is licensed and self-hosted
         now, so the card can finally be in the brand's own face;
       · it carried five text blocks — headline, sub, a red deadline tape, the
         wordmark and a whole zine panel with its own quote. The brief says ONE
         SENTENCE. At feed size that clutter was the whole problem.

     THE ONE SENTENCE names the object, the people and the mechanism in that order:
     "Make a magazine with your people, on a deadline." A reader who sees nothing
     else knows what this is.

     THE PROOF IS THE COVERS, NOT A CLAIM. Four real published issues, fanned like a
     rack — modelling, bold editorial, penmanship, illustration. That range IS the
     product ("learn WHAT?" is the question the page's own notes say the hero
     provokes) and it is the one thing a competitor cannot fake without doing the
     work. They are the same 320x400 crops the page's own selector rack uses.

     JUDGED AT FEED SIZE. Previews render 400-600px wide, so the headline is 70px
     (23px at 400) and there is no type below 26px anywhere on the card. Every
     version was downscaled to 400 and read there before being kept.

     THE LOGO IS UNMODIFIED — upright, unrotated, no shadow, no filter, not set in a
     typeface. §03 of the brand book. The PAPER carries the tilt, which is what the
     logo law allows and what the masthead already does.

     GREEN IS NOT THE GROUND. The brand book never grounds anything in Grass; the
     desk is warm neutral, Grass appears only in the wordmark and one full stop.
     ============================================================================ -->
<style>
@font-face{font-family:"Pitch";src:url(assets/fonts/pitch-bold.woff2) format("woff2");font-weight:700;font-style:normal;font-display:block}
@font-face{font-family:"Pitch";src:url(assets/fonts/pitch-bold-italic.woff2) format("woff2");font-weight:700;font-style:italic;font-display:block}
@font-face{font-family:"Pitch Sans";src:url(assets/fonts/pitch-sans-bold.woff2) format("woff2");font-weight:700;font-display:block}
@font-face{font-family:"Pitch Sans";src:url(assets/fonts/pitch-sans-semibold.woff2) format("woff2");font-weight:600;font-display:block}
@font-face{font-family:"Birdie";src:url(assets/fonts/birdie-regular.woff2) format("woff2");font-weight:400;font-display:block}
:root{--oats:#FEF6E4;--ink:#414D57;--grass:#1CAB5B;--grass-deep:#0C6E39;
      --colorado:#F75458;--coral-ink:#C9343A;--lazuli-deep:#1C6F94;--schoolbus:#ECAF21}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#C9BEA4;font-family:"Pitch Sans",monospace;-webkit-font-smoothing:antialiased}
.card{position:relative;width:1200px;height:630px;overflow:hidden;
  background:
    radial-gradient(1100px 640px at 20% -10%, rgba(255,252,242,.55), transparent 62%),
    repeating-linear-gradient(0deg,transparent 0 27px,rgba(80,66,44,.045) 27px 28px),
    #C9BEA4}
/* THE SHEET. Torn on every edge, tilted, with a hard offset shadow — the page's own
   paper idiom. The tilt lives here so the wordmark never has to move. */
.sheet{position:absolute;left:-26px;top:-30px;width:742px;height:690px;
  background:var(--oats);transform:rotate(-1.15deg);
  box-shadow:16px 18px 0 0 rgba(48,38,22,.30);filter:url(#torn)}
.inner{position:absolute;left:74px;top:96px;width:566px}
.eyebrow{font-family:"Birdie",cursive;font-size:30px;color:var(--coral-ink);
  transform:rotate(-1deg);display:block;margin-bottom:16px}
h1{font-family:"Pitch",Georgia,serif;font-weight:700;font-style:italic;
  font-size:70px;line-height:1.03;letter-spacing:-.022em;color:var(--ink);
  word-spacing:-.30em}   /* Pitch is MONOSPACED: without this the words set as isolated tokens */
h1 .g{color:var(--grass-deep)}
h1 .stop{color:var(--grass)}
.mark{position:absolute;left:74px;bottom:66px;display:flex;align-items:center;gap:18px}
.wordmark{font-family:"Pitch",Georgia,serif;font-weight:700;font-style:italic;
  font-size:52px;color:var(--grass-deep);letter-spacing:-.03em}
.rule{width:3px;height:34px;background:var(--ink);opacity:.28;border-radius:2px}
.dom{font-family:"Pitch Sans",monospace;font-weight:600;font-size:26px;
  letter-spacing:.10em;color:var(--ink);opacity:.72}
/* THE RACK. Four real covers, fanned, each on its own angle and its own pin. */
.rack{position:absolute;right:0;top:0;width:520px;height:630px;overflow:hidden}
.zine{position:absolute;width:252px;aspect-ratio:4/5;background:var(--oats);
  border:3px solid var(--ink);box-shadow:8px 10px 0 0 rgba(48,38,22,.34);overflow:hidden}
.zine img{width:100%;height:100%;object-fit:cover;display:block}
.z1{right:238px;top:44px;transform:rotate(-5.2deg)}
.z2{right:6px;top:112px;transform:rotate(4.2deg);z-index:2}
.z3{right:188px;top:292px;transform:rotate(2.4deg);z-index:3}
.z4{display:none}
.pin{position:absolute;top:-11px;left:50%;margin-left:-9px;width:19px;height:19px;
  border-radius:50%;border:3px solid var(--ink);box-shadow:2px 3px 0 0 rgba(48,38,22,.4)}
.p1{background:var(--colorado)} .p2{background:var(--schoolbus)}
.p3{background:var(--lazuli-deep)} .p4{background:var(--grass)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="torn"><feTurbulence type="fractalNoise" baseFrequency=".009" numOctaves="5" seed="9" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G"/></filter>
</defs></svg>
<div class="card">
  <div class="sheet"></div>
  <div class="rack">
    <div class="zine z1"><span class="pin p1"></span><img src="assets/zines/hero/covers/silkroad.jpg" alt=""></div>
    <div class="zine z2"><span class="pin p2"></span><img src="assets/zines/hero/covers/office.jpg" alt=""></div>
    <div class="zine z3"><span class="pin p3"></span><img src="assets/zines/hero/covers/interactive.jpg" alt=""></div>
  </div>
  <div class="inner">
    <span class="eyebrow">a club, an issue, a deadline</span>
    <h1>Make a <span class="g">magazine</span> with your people, on a deadline<span class="stop">.</span></h1>
  </div>
  <div class="mark">
    <span class="wordmark">drex.</span>
    <span class="rule"></span>
    <span class="dom">DREX.STYLE</span>
  </div>
</div>
</body></html>
