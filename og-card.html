<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Patrick+Hand&display=swap">
<style>
:root{--oats:#FEF6E4;--grass:#1CAB5B;--sambas:#414D57;--colorado:#F75458;--lazuli:#2496C9;--schoolbus:#ECAF21;--happy:#F1DD01;--ink:#2f2110}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px}
.card{position:relative;width:1200px;height:630px;overflow:hidden;background:var(--grass)}

.msg{position:absolute;left:96px;top:0;height:630px;width:640px;display:flex;flex-direction:column;justify-content:center}

/* Eyebrow — small colorado torn tag, oats text, clearly subordinate */
.a-eyebrow{align-self:flex-start;font-family:"Courier Prime",monospace;font-style:italic;font-weight:700;color:var(--oats);font-size:31px;line-height:1.1;letter-spacing:-.02em;background:var(--colorado);padding:9px 18px 11px;box-shadow:5px 5px 0 rgba(0,0,0,.22);transform:rotate(-1.6deg);clip-path:polygon(0 6%,4% 0,22% 5%,40% 0,60% 6%,80% 0,97% 5%,100% 0,100% 92%,97% 100%,78% 95%,58% 100%,38% 95%,18% 100%,3% 96%,0 100%)}

/* Headline — dominant oats, Courier Prime italic 700 */
.a-head{font-family:"Courier Prime",monospace;font-style:italic;font-weight:700;color:var(--oats);font-size:92px;line-height:.94;letter-spacing:-.02em;margin-top:30px}

/* Payoff — Patrick Hand, oats, schoolbus flat marker block behind "portfolio." */
.a-hello{font-family:"Patrick Hand",cursive;color:var(--oats);font-size:56px;line-height:1;margin-top:40px}
.a-hello .hl{position:relative;display:inline-block;color:var(--ink);padding:0 8px}
.a-hello .hl::before{content:"";position:absolute;left:0;right:0;top:6%;bottom:6%;background:var(--schoolbus);transform:rotate(-2.4deg);z-index:-1}

/* Polaroid — oats paper card floats the unmodified green mark on the green ground */
.polaroid{position:absolute;right:82px;top:135px;width:360px;height:360px;background:var(--oats);border-radius:10px;box-shadow:8px 8px 0 rgba(0,0,0,.25);transform:rotate(2.2deg);display:flex;align-items:center;justify-content:center}
.a-mark{display:block;height:300px}

/* Doodle star accent near the polaroid */
.a-star{position:absolute;right:392px;top:112px;width:56px;height:56px;transform:rotate(-8deg)}
</style></head><body><div class="card">
<div class="msg">
  <p class="a-eyebrow">Tiny creative clubs with show-and-tell deadlines.</p>
  <h1 class="a-head">A club for whatever you make.</h1>
  <p class="a-hello">Hello, <span class="hl">portfolio.</span></p>
</div>
<svg class="a-star" viewBox="0 0 100 100"><path d="M50 3 C55 35,65 45,97 50 C65 55,55 65,50 97 C45 65,35 55,3 50 C35 45,45 35,50 3Z" fill="#F1DD01"/></svg>
<div class="polaroid">

</div>
</div></body></html>
