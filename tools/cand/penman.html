<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>drex &mdash; og card 1200x630</title>
<!-- ============================================================================
     THE SHARE CARD. Renders to assets/og.png at exactly 1200x630.

     RE-RENDER (there is no build step in this repo):
       cd drex-landing && python3 -m http.server 8931 --bind 127.0.0.1 &
       B=~/.claude/skills/gstack/browse/dist/browse
       $B viewport 1200x630 ; $B goto "http://127.0.0.1:8931/og-card.html" ; sleep 5
       $B screenshot --viewport assets/og.png

     THE BRIEF WAS "the best design and typography I've ever seen in an og image".
     Four designs were built and rendered before this one was picked: a collage of
     real covers behind a torn sheet; one cover full-bleed under a scrim; the dead
     group chat beside "4,000 messages. Nothing made."; and this. The chat one is
     the most arresting and was rejected for selling a problem instead of a product.
     The full-bleed one was rejected because the scrim killed the maker's face.

     WHY THIS ONE. The card is an OBJECT, not a slide - a magazine lying on a desk
     with a second issue under it, torn at every edge, taped down across those edges
     onto the desk itself. That is the product, depicted, and it is the one thing a
     competitor's card cannot copy without doing the work. Everything on it is real:
     a published issue, a maker holding the drawing she made, and her club's own
     reflection question printed under it.

     JUDGED AT FEED SIZE, NOT AT FULL SIZE. Previews render around 400-600px wide,
     so every version was downscaled to 400 and read there before being accepted.
     That is why the headline is 66px and the deadline is a red TAPE rather than a
     third weight of type: at 400px the tape survives as a red mark and a type
     change does not.

     THE LOGO IS UNMODIFIED - no rotation, no shadow, no recolour, no filter, and
     not set in a typeface. The PAPER carries the tilt and the offset shadow, which
     is what the logo law allows and what the masthead already does.

     GREEN IS NOT THE GROUND HERE. The brand book never grounds anything in Grass
     and this card obeys that, unlike the one it replaces: the desk is warm neutral,
     Grass appears as a bar (the two words it emphasises), and the accents are the
     page's own tape colours.
     ============================================================================ -->

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sometype+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Patrick+Hand&display=swap">
<style>
:root{--oats:#FEF6E4;--grass:#1CAB5B;--sambas:#414D57;--colorado:#F75458;--lazuli:#2496C9;--happy:#F1DD01;--ink:#2f2110}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
.card{position:relative;width:1200px;height:630px;overflow:hidden;background:#C4B99E}
.card::before{content:"";position:absolute;inset:0;
  background:
   radial-gradient(1200px 700px at 22% 0%, rgba(255,252,240,.6), transparent 64%),
   repeating-linear-gradient(180deg,transparent 0 41px,rgba(90,70,40,.075) 41px 42px),
   radial-gradient(circle at 12% 78%, rgba(120,95,55,.17) 0 2px, transparent 3px) 0 0/57px 63px,
   radial-gradient(circle at 74% 26%, rgba(120,95,55,.14) 0 2px, transparent 3px) 0 0/83px 71px}
svg.defs{position:absolute;width:0;height:0}

/* A SECOND ISSUE UNDER THE FIRST. Depth is what makes this read as a pile of real things
   rather than a graphic, and the product is issue AFTER issue. */
.under{position:absolute;left:82px;top:70px;width:886px;height:508px;background:#EFE4CC;
  transform:rotate(3.2deg);box-shadow:14px 16px 0 rgba(58,44,22,.22)}
.under::before{content:"";position:absolute;inset:-9px;background:#EFE4CC;filter:url(#torn);z-index:-1}

.plate{position:absolute;left:64px;top:40px;width:912px;height:558px;background:var(--oats);
  transform:rotate(-1.6deg);box-shadow:18px 20px 0 rgba(58,44,22,.32);
  display:grid;grid-template-columns:1.16fr 1fr}
.plate::before{content:"";position:absolute;inset:-11px;background:var(--oats);filter:url(#torn);z-index:-1}

/* padding-bottom is the wordmark's exclusion zone, not a layout choice: DESIGN.md:136
   requires one x-glyph (0.25 x rendered width) clear on all sides, which at a 173px mark
   is 43px. It measured -4 below and -10 above before this - the mark hung off the plate
   and sat on the tape. */
.L{padding:40px 30px 56px 46px;display:flex;flex-direction:column;justify-content:space-between;position:relative;z-index:2}
.mast{font-family:"Sometype Mono",monospace;font-style:italic;font-weight:700;font-size:57px;
  line-height:.95;letter-spacing:-.04em;color:var(--ink)}
.mast b{color:var(--grass)}
.rule{height:5px;background:var(--ink);margin:20px 0 18px;filter:url(#rough)}
.line{font-family:"Sometype Mono",monospace;font-size:24px;color:var(--ink);line-height:1.4}
/* the page marks these two words this way round, so the card does too: CHALLENGE is the
   red Dymo slab, the deadline is the highlighter band. */
.dymo{display:inline-block;background:var(--colorado);color:var(--oats);border:3px solid var(--ink);
  border-radius:4px;padding:4px 12px 2px;font-family:"Sometype Mono",monospace;font-weight:700;
  font-size:23px;letter-spacing:.09em;transform:rotate(-1.8deg);box-shadow:4px 4px 0 var(--ink)}
.mark-hl{position:relative;display:inline-block;font-weight:700;padding:0 .18em;margin-top:14px}
.mark-hl::before{content:"";position:absolute;left:-.1em;right:-.12em;top:.04em;bottom:-.06em;z-index:-1;
  background:var(--happy);transform:rotate(-1.1deg) skewX(-4deg);filter:url(#rough);border-radius:2px}
.mark{width:166px;margin-top:52px}
.mark svg{display:block;width:100%;height:auto}

.R{position:relative;overflow:hidden;border-left:5px solid var(--ink)}
.R i{position:absolute;inset:0;background:url(../../assets/zines/penmans-desk.jpg) center 14%/cover}
.R::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 60px rgba(58,44,22,.24)}

.tape{position:absolute;z-index:6;border-left:1px solid rgba(65,77,87,.18);border-right:1px solid rgba(65,77,87,.18)}
.t1{width:198px;height:48px;background:rgba(36,150,201,.48);left:14px;top:44px;transform:rotate(-31deg)}
.t2{width:178px;height:46px;background:rgba(241,221,1,.66);right:158px;bottom:44px;transform:rotate(-16deg)}

</style></head><body>

<filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.04 0.09" numOctaves="2" seed="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/></filter></svg>

      <div>
        <p class="mast">Accountability buddies running their <b>own magazine</b>.</p>
        <div class="rule"></div>
        <p class="line">Each issue is a new <span class="dymo">CHALLENGE</span><br><span class="mark-hl">with a deadline</span>.</p>
